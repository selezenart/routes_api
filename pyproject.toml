# Delay tracker (tracker/). The Django app in src/ keeps using requirements.txt.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bahn-delay-tracker"
version = "0.1.0"
description = "Records Deutsche Bahn delays per station and line over time"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tracker/tests"]

[tool.coverage.run]
source = ["tracker"]
omit = ["tracker/tests/*"]
